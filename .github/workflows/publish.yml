name: Publish Python package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Verified release tag to publish
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check release tag and version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python -c 'import os,tomllib; version=tomllib.load(open("pyproject.toml","rb"))["project"]["version"]; assert os.environ["RELEASE_TAG"] == "v"+version, "Choose the release tag matching the package version"'
          git show-ref --verify "refs/tags/${RELEASE_TAG}"
      - name: Require successful CI for the release revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          revision="$(git rev-parse HEAD)"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="$revision" -f event=push -f per_page=1 > "$RUNNER_TEMP/release-ci.json"
          python scripts/check_release_ci.py "$RUNNER_TEMP/release-ci.json" "$revision"
      - name: Build and validate distributions
        run: |
          python -m pip install 'build>=1.2,<2' 'twine>=6,<8'
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: pypi-dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ !github.event.repository.private && vars.PUBLISH_PYPI == 'true' }}
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/venn-vdm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pypi-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

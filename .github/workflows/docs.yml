name: Documentation site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install 'Markdown>=3.7,<4'
      - run: python scripts/build_site.py --output "$RUNNER_TEMP/venn-site"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/venn-site

  deploy:
    # Enable Pages (source: GitHub Actions) and set the repository variable DEPLOY_PAGES=true.
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && !github.event.repository.private && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
